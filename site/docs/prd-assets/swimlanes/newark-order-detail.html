main{padding:24px;width:max-content;min-width:calc(100vw - 48px);box-sizing:border-box}
.diagram{background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:inline-block}
svg text{font-family:inherit;fill:#111827}

.node-decision polygon{fill:#fff7ed;stroke:#c2410c;stroke-width:1.4}

.node-fork rect,.node-join rect{fill:#111827}
.caption{fill:#4b5563}
.edge path{fill:none;stroke:#0284C7;stroke-width:1.5}
.edge-back path{stroke-dasharray:5 3}
.edge .edge-hit{stroke:transparent;stroke-width:14;stroke-dasharray:none;pointer-events:stroke}
.edge-label-bg{fill:#fff;stroke:#e5e7eb;stroke-width:.8}
.edge-label{fill:#1f2937}
.title{font-size:20px;font-weight:700}
.annotation-box{fill:#fffbea;stroke:#b49b50;stroke-width:1}
.annotation-link{fill:none;stroke:#9a8549;stroke-width:1;stroke-dasharray:3 4}
.annotation-kind{fill:#806b32;font-weight:600}

button{font:inherit;cursor:pointer;padding:8px 16px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}
button:disabled{cursor:wait;opacity:.6}
.toolbar{margin-bottom:16px;position:sticky;left:24px;width:max-content}
@media print{.toolbar{display:none}}
/* Revision-prompt picker: page-only styles, never serialized into the PNG. */
[data-prompt]{cursor:pointer}
.picked{filter:drop-shadow(0 0 4px #f59e0b) drop-shadow(0 0 1px #f59e0b)}
.prompt-panel{position:absolute;z-index:10;width:420px;max-width:calc(100vw - 48px);padding:10px 12px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.prompt-panel[hidden]{display:none}
.prompt-head{display:flex;justify-content:flex-end;margin-bottom:6px}
.prompt-copy{padding:4px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:#374151}
.prompt-copy svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prompt-copy .icon-done{display:none;color:#15803d}
.prompt-copy.done .icon-copy{display:none}.prompt-copy.done .icon-done{display:block}
.prompt-panel textarea{display:block;width:100%;box-sizing:border-box;min-height:132px;resize:vertical;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#1f2937;border:1px solid #e5e7eb;border-radius:6px;padding:8px;background:#f9fafb}

n-d_so_fail"/><use class="edge-origin" href="#origin-d_dn_request"/><use class="edge-origin" href="#origin-d_dn_result"/><use class="edge-origin" href="#origin-d_dn_yes"/><use class="edge-origin" href="#origin-d_dn_no"/><use class="edge-origin" href="#origin-d_select"/><use class="edge-origin" href="#origin-d_show"/><use class="edge-origin" href="#origin-d_dn_fail"/></svg></div><div id="prompt-panel" class="prompt-panel" hidden><div class="prompt-head"><button class="prompt-copy" type="button" aria-label="复制提示词" title="复制提示词"><svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg><svg class="icon-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></button></div><textarea readonly spellcheck="false" aria-label="修改提示词"></textarea></div><script>
const button = document.querySelector('#export-png');
button.addEventListener('click', async () => {
  button.disabled = true;
  button.textContent = '正在导出…';
  let svgUrl;
  try {
    await document.fonts.ready;
    closePrompt();
    const svg = document.querySelector('.diagram svg');
    const {width, height} = svg.viewBox.baseVal;
    const scale = Math.min(2, 16384 / width, 16384 / height,
                           Math.sqrt(32000000 / (width * height)));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.floor(width * scale));
    canvas.height = Math.max(1, Math.floor(height * scale));
    const source = new XMLSerializer().serializeToString(svg);
    svgUrl = URL.createObjectURL(new Blob([source], {type: 'image/svg+xml;charset=utf-8'}));
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('无法读取泳道图'));
      img.src = svgUrl;
    });
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('浏览器无法创建图片画布');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const png = await new Promise((resolve, reject) =>
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG 编码失败')), 'image/png'));
    const pngUrl = URL.createObjectURL(png);
    const link = document.createElement('a');
    link.href = pngUrl;
    link.download = button.dataset.filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(pngUrl), 10000);
  } catch (error) {
    alert('导出失败：' + error.message);
  } finally {
    if (svgUrl) URL.revokeObjectURL(svgUrl);
    button.disabled = false;
    button.textContent = '导出 PNG';
  }
});

// Revision-prompt picker: click a lane, column, node, edge or note to get a
// paste-ready prompt. The panel lives outside the SVG, so PNG export ignores it.
const panel = document.querySelector('#prompt-panel');
const promptText = panel.querySelector('textarea');
const copyButton = panel.querySelector('.prompt-copy');
let picked = null;
function closePrompt() {
  if (picked) picked.classList.remove('picked');
  picked = null;
  panel.hidden = true;
  copyButton.classList.remove('done');
}
function openPrompt(element, event) {
  if (picked) picked.classList.remove('picked');
  picked = element;
  picked.classList.add('picked');
  const text = element.getAttribute('data-prompt');
  promptText.value = text;
  copyButton.classList.remove('done');
  panel.hidden = false;
  const gap = 12;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - panel.offsetWidth - gap;
  panel.style.left = Math.max(window.scrollX + gap, Math.min(event.pageX + gap, maxLeft)) + 'px';
  panel.style.top = (event.pageY + gap) + 'px';
}
document.querySelector('.diagram svg').addEventListener('click', event => {
  const element = event.target.closest('[data-prompt]');
  if (!element) { closePrompt(); return; }
  event.stopPropagation();
  openPrompt(element, event);
});
document.addEventListener('click', event => {
  if (!panel.hidden && !panel.contains(event.target)) closePrompt();
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') closePrompt(); });
promptText.addEventListener('focus', () => promptText.select());
copyButton.addEventListener('click', async () => {
  const text = promptText.value;
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (error) { ok = false; }
  if (!ok) {
    promptText.focus();
    promptText.select();
    try { ok = document.execCommand('copy'); } catch (error) { ok = false; }
  }
  if (ok) {
    copyButton.classList.add('done');
    setTimeout(() => copyButton.classList.remove('done'), 1500);
  } else {
    promptText.focus();
    promptText.select();
    alert('无法自动复制，已选中文本，请按 Ctrl/Cmd + C 复制。');
  }
});
</script></main></body></html>
