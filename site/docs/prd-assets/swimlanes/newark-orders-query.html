font-size="13" text-anchor="middle" dominant-baseline="middle"><tspan x="2105.0" dy="0">展示账期查询结果</tspan></text></g><g class="node node-end" id="node-terms_ready" data-prompt="$swimlane-compiler 修改 newark-orders-query.json（订单列表查询与筛选）：&#10;目标：节点 `terms_ready`（结束，label「账期结果可用」，泳道「用户」）&#10;上游：「展示账期查询结果」；下游：无&#10;&#10;我想要："><title>账期结果可用</title><circle class="outer" cx="2335.0" cy="336.0" r="20.0"/><circle class="inner" cx="2335.0" cy="336.0" r="14.0"/><text class="caption" x="2335.0" y="368.0" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="2335.0" dy="0">账期结果可用</tspan></text></g><g class="node node-action" id="node-set_filters" data-prompt="$swimlane-compiler 修改 newark-orders-query.json（订单列表查询与筛选）：&#10;目标：节点 `set_filters`（动作，label「选择状态、日期或页码」，泳道「用户」）&#10;上游：「筛选或翻页？」（用户修改条件或页码）；下游：「组合状态与日期条件」&#10;&#10;我想要："><title>选择状态、日期或页码</title><rect x="2260.0" y="414.0" width="150" height="60" rx="6"/><text class="" x="2335.0" y="444.0" font-size="13" text-anchor="middle" dominant-baseline="middle"><tspan x="2335.0" dy="0">选择状态、日期或页码</tspan></text></g><use class="edge-origin" href="#origin-q_enter"/><use class="edge-origin" href="#origin-q_lookup"/><use class="edge-origin" href="#origin-q_mapping"/><use class="edge-origin" href="#origin-q_mapping_yes"/><use class="edge-origin" href="#origin-q_mapping_no"/><use class="edge-origin" href="#origin-q_stop"/><use class="edge-origin" href="#origin-q_order_branch"/><use class="edge-origin" href="#origin-q_credit_branch"/><use class="edge-origin" href="#origin-q_request"/><use class="edge-origin" href="#origin-q_response"/><use class="edge-origin" href="#origin-q_choose"/><use class="edge-origin" href="#origin-q_change_yes"/><use class="edge-origin" href="#origin-q_change_no"/><use class="edge-origin" href="#origin-q_requery"/><use class="edge-origin" href="#origin-q_credit_yes"/><use class="edge-origin" href="#origin-q_credit_no"/><use class="edge-origin" href="#origin-q_hide"/><use class="edge-origin" href="#origin-q_financial"/><use class="edge-origin" href="#origin-q_credit_return"/><use class="edge-origin" href="#origin-q_credit_done"/><use class="edge-origin" href="#origin-q_terms"/><use class="edge-origin" href="#origin-q_terms_return"/><use class="edge-origin" href="#origin-q_terms_done"/></svg></div><div id="prompt-panel" class="prompt-panel" hidden><div class="prompt-head"><button class="prompt-copy" type="button" aria-label="复制提示词" title="复制提示词"><svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg><svg class="icon-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></button></div><textarea readonly spellcheck="false" aria-label="修改提示词"></textarea></div><script>
const button = document.querySelector('#export-png');
button.addEventListener('click', async () => {
  button.disabled = true;
  button.textContent = '正在导出…';
  let svgUrl;
  try {
    await document.fonts.ready;
    closePrompt();
    const svg = document.querySelector('.diagram svg');
    const {width, height} = svg.viewBox.baseVal;
    const scale = Math.min(2, 16384 / width, 16384 / height,
                           Math.sqrt(32000000 / (width * height)));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.floor(width * scale));
    canvas.height = Math.max(1, Math.floor(height * scale));
    const source = new XMLSerializer().serializeToString(svg);
    svgUrl = URL.createObjectURL(new Blob([source], {type: 'image/svg+xml;charset=utf-8'}));
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('无法读取泳道图'));
      img.src = svgUrl;
    });
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('浏览器无法创建图片画布');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const png = await new Promise((resolve, reject) =>
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG 编码失败')), 'image/png'));
    const pngUrl = URL.createObjectURL(png);
    const link = document.createElement('a');
    link.href = pngUrl;
    link.download = button.dataset.filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(pngUrl), 10000);
  } catch (error) {
    alert('导出失败：' + error.message);
  } finally {
    if (svgUrl) URL.revokeObjectURL(svgUrl);
    button.disabled = false;
    button.textContent = '导出 PNG';
  }
});

// Revision-prompt picker: click a lane, column, node, edge or note to get a
// paste-ready prompt. The panel lives outside the SVG, so PNG export ignores it.
const panel = document.querySelector('#prompt-panel');
const promptText = panel.querySelector('textarea');
const copyButton = panel.querySelector('.prompt-copy');
let picked = null;
function closePrompt() {
  if (picked) picked.classList.remove('picked');
  picked = null;
  panel.hidden = true;
  copyButton.classList.remove('done');
}
function openPrompt(element, event) {
  if (picked) picked.classList.remove('picked');
  picked = element;
  picked.classList.add('picked');
  const text = element.getAttribute('data-prompt');
  promptText.value = text;
  copyButton.classList.remove('done');
  panel.hidden = false;
  const gap = 12;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - panel.offsetWidth - gap;
  panel.style.left = Math.max(window.scrollX + gap, Math.min(event.pageX + gap, maxLeft)) + 'px';
  panel.style.top = (event.pageY + gap) + 'px';
}
document.querySelector('.diagram svg').addEventListener('click', event => {
  const element = event.target.closest('[data-prompt]');
  if (!element) { closePrompt(); return; }
  event.stopPropagation();
  openPrompt(element, event);
});
document.addEventListener('click', event => {
  if (!panel.hidden && !panel.contains(event.target)) closePrompt();
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') closePrompt(); });
promptText.addEventListener('focus', () => promptText.select());
copyButton.addEventListener('click', async () => {
  const text = promptText.value;
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (error) { ok = false; }
  if (!ok) {
    promptText.focus();
    promptText.select();
    try { ok = document.execCommand('copy'); } catch (error) { ok = false; }
  }
  if (ok) {
    copyButton.classList.add('done');
    setTimeout(() => copyButton.classList.remove('done'), 1500);
  } else {
    promptText.focus();
    promptText.select();
    alert('无法自动复制，已选中文本，请按 Ctrl/Cmd + C 复制。');
  }
});
</script></main></body></html>
